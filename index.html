<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel da TV</title>
<style>
/* =========================================================
   PAINEL DA TV — layout "Caos Roxo" (horizontal 1920x1080)
   Configurações: bloco CONFIG no <script> lá embaixo.
   ========================================================= */
:root{
  --bg:linear-gradient(118deg,#2a1470 0%,#4b20b8 30%,#7a2fd6 58%,#b23fe0 80%,#d552d6 100%);
  --txt:#fff;
  --sub:rgba(255,255,255,.72);
  --dim:rgba(255,255,255,.48);
  --line:rgba(255,255,255,.16);
  --panel:rgba(20,6,60,.28);
  --now:#ff4d6d;
  --up:#7dffb0; --down:#ffb0b0;
  --spot:#1ed760;
}
body.tema-preto{--bg:#000;--panel:rgba(255,255,255,.06);--line:rgba(255,255,255,.12);--badge:#ff7a1a;--badge-txt:#1a0800;--today:#ff7a1a}
body.tema-laranja{--bg:radial-gradient(ellipse 75% 95% at 100% 100%,#ff7a1a 0%,#d4520d 22%,#6e2306 48%,rgba(20,6,0,0) 75%),linear-gradient(118deg,#000 0%,#050302 55%,#1a0a03 100%);
  --panel:rgba(255,255,255,.05);--line:rgba(255,255,255,.12);--badge:#ff7a1a;--badge-txt:#1a0800;--today:#ff7a1a}
body.tema-azul{--bg:linear-gradient(118deg,#071a3d 0%,#0d3a7a 40%,#1667b8 75%,#2a9fd8 100%);--panel:rgba(0,10,40,.3)}
body.tema-escuro{--bg:linear-gradient(118deg,#0b0b10 0%,#16161f 55%,#22222e 100%);--panel:rgba(255,255,255,.04)}
body.tema-verde{--bg:linear-gradient(118deg,#062b22 0%,#0b4d3b 45%,#138061 80%,#2bb07e 100%);--panel:rgba(0,20,10,.3)}

*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#000;color:var(--txt);
  font-family:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;cursor:none}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;overflow:hidden;
  transform-origin:center center;transform:translate(-50%,-50%);background:var(--bg)}
#ui{position:absolute;inset:0;padding:30px 36px 30px;display:grid;
  grid-template-columns:812px 560px 1fr;gap:0 36px;transition:transform 4s ease}
.col{display:flex;flex-direction:column;min-height:0;min-width:0}
.hide{transition:opacity .8s}
.lbl{font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--sub);font-weight:600}

/* ================= COLUNA A: relógio + semana ================= */
.head{display:flex;align-items:center;gap:26px;height:92px;flex:none}
.clock{font-size:64px;font-weight:300;letter-spacing:-.01em;font-variant-numeric:tabular-nums;line-height:1}
.clock sup{font-size:22px;color:var(--sub);vertical-align:top;margin-left:3px}
.date{font-size:27px;font-weight:600}
.date small{display:block;font-size:17px;font-weight:400;color:var(--sub);margin-top:3px}
.wifi{margin-left:auto;display:flex;align-items:center;gap:12px}
.wifi .t{text-align:right;font-size:18px;font-weight:600}
.wifi .t small{display:block;font-size:13px;color:var(--sub);font-weight:400}
.wifi canvas{width:84px;height:84px;background:#fff;border-radius:6px;padding:5px;image-rendering:pixelated}

.week{flex:1;margin-top:14px;display:grid;grid-template-columns:46px repeat(7,1fr);
  grid-template-rows:40px auto 1fr;min-height:0;background:var(--panel);border-radius:14px;padding:8px 8px 10px 0}
.wk-dh{text-align:center;font-size:14px;color:var(--sub);text-transform:uppercase;letter-spacing:.06em;align-self:center}
.wk-dh b{font-size:20px;color:#fff;margin-left:4px;letter-spacing:0}
.wk-dh.today b{background:var(--today,var(--now));border-radius:14px;padding:1px 8px}
.wk-ad{grid-column:2/-1;display:grid;grid-template-columns:repeat(7,1fr);gap:0;border-bottom:1px solid var(--line);padding-bottom:4px;min-height:6px}
.wk-ad .cell{padding:0 3px;display:flex;flex-direction:column;gap:3px}
.wk-ad .pill{font-size:12.5px;border-radius:5px;padding:2px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.wk-hours{position:relative;min-height:0}
.wk-hours div{position:absolute;right:8px;font-size:12px;color:var(--dim);transform:translateY(-50%);font-variant-numeric:tabular-nums}
.wk-body{grid-column:2/-1;position:relative;display:grid;grid-template-columns:repeat(7,1fr);min-height:0}
.wk-body .gl{position:absolute;left:0;right:0;border-top:1px solid var(--line)}
.wk-day{position:relative;border-left:1px solid var(--line)}
.wk-day.today{background:rgba(255,255,255,.06)}
.ev{position:absolute;border-radius:6px;padding:3px 6px;overflow:hidden;font-size:12.5px;line-height:1.2;
  box-shadow:0 1px 0 rgba(0,0,0,.15);border:1px solid rgba(0,0,0,.12)}
.ev b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev span{opacity:.8;font-size:11.5px}
.ev.past{opacity:.45}
.nowline{position:absolute;left:-4px;right:0;height:2px;background:var(--now);z-index:3}
.nowline::before{content:"";position:absolute;left:-5px;top:-5px;width:12px;height:12px;border-radius:50%;background:var(--now)}
.nowtag{position:absolute;left:-44px;transform:translateY(-50%);background:var(--now);font-size:11px;font-weight:700;
  border-radius:4px;padding:1px 4px;z-index:3}

/* ================= COLUNA B: 3 dias + listas ================= */
.days{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;height:560px;flex:none;padding-top:8px}
.day h2{display:flex;align-items:baseline;gap:8px;font-weight:300;font-size:40px;line-height:1;margin-bottom:14px}
.day h2 small{font-size:15px;font-weight:600;color:var(--sub);text-transform:uppercase;letter-spacing:.08em}
.it{border-left:3px solid;padding:1px 0 1px 9px;margin-bottom:12px}
.it time{display:block;font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums}
.it b{display:block;font-size:17px;font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.it.past{opacity:.45}
.it.now time{color:#fff;font-weight:700}
.more{font-size:13px;color:var(--dim)}
.empty{font-size:15px;color:var(--dim)}

.tick{display:flex;gap:10px;flex:none;margin-top:6px}
.tk{flex:1;text-align:center;border-top:2px solid var(--line);padding-top:6px}
.tk small{display:block;font-size:12px;color:var(--sub);letter-spacing:.08em}
.tk b{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
.tk i{display:block;font-style:normal;font-size:12px}
.tk i.up{color:var(--up)} .tk i.down{color:var(--down)}
.news{margin-top:16px;font-size:16px;flex:none;display:flex;gap:10px;align-items:center;min-width:0}
.news .src{flex:none;font-size:11.5px;font-weight:800;letter-spacing:.1em;background:var(--badge,#fff);color:var(--badge-txt,#3b1a8a);border-radius:4px;padding:2px 6px}
.news .item{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:opacity .6s}

.lists{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:20px;min-height:0}
.list{background:var(--panel);border-radius:14px;padding:14px 16px;overflow:hidden;min-height:0}
.list .lbl{margin-bottom:10px;display:flex;align-items:center;gap:8px}
.list .lbl .badge{margin-left:auto;background:var(--badge,#fff);color:var(--badge-txt,#3b1a8a);border-radius:10px;padding:1px 8px;font-size:13px;letter-spacing:0}
.task{display:flex;gap:9px;align-items:flex-start;font-size:15.5px;padding:3px 0}
.task::before{content:"";flex:none;width:13px;height:13px;border:2px solid var(--sub);border-radius:3px;margin-top:3px}
.task span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task small{color:var(--up);font-size:12px;margin-left:auto;flex:none;padding-left:6px}
.mail{padding:4px 0 6px;border-bottom:1px solid var(--line)}
.mail:last-child{border-bottom:0}
.mail b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mail span{display:block;font-size:13.5px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub-h{font-size:12.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.1em;margin:8px 0 4px}

/* ================= COLUNA C: clima, YouTube, foto, Spotify ================= */
.wx{display:flex;align-items:center;gap:12px;height:92px;flex:none;min-width:0}
.wx .ico{font-size:44px;line-height:1}
.wx .temp{font-size:46px;font-weight:300;line-height:1}
.wx .d{font-size:13.5px;color:var(--sub);line-height:1.25;min-width:0;flex:1}
.wx .d b{display:block;color:#fff;font-size:15px}
.fc{display:flex;gap:10px;margin-left:auto;flex:none}
.fc div{text-align:center;font-size:12.5px;color:var(--sub)}
.fc div b{display:block;font-size:22px;margin:2px 0;font-weight:400}
.fc div span{color:#fff}

.media{border-radius:14px;overflow:hidden;position:relative;background:rgba(0,0,0,.25);flex:none;transition:all .6s ease}
#yt{aspect-ratio:16/9;margin-top:14px}
#yt iframe{position:absolute;inset:0;width:100%;height:100%;border:0;pointer-events:none}
.tag{position:absolute;left:8px;top:8px;z-index:2;background:rgba(0,0,0,.55);border-radius:6px;padding:3px 8px;font-size:12.5px}
.tag b{color:#ff4040}
#foto{flex:1;margin-top:16px;min-height:0}
.ph{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity 2s}
.ph.on{opacity:1}
.ph.fallback{background:linear-gradient(135deg,rgba(255,255,255,.1),rgba(255,255,255,.02))}

#spotify{display:flex;gap:12px;align-items:center;margin-top:16px;flex:none;height:78px}
#spotify img{width:78px;height:78px;border-radius:8px;object-fit:cover;flex:none;background:rgba(0,0,0,.3)}
#spotify .info{min-width:0;flex:1}
#spotify .l{font-size:12px;color:var(--spot);letter-spacing:.12em;text-transform:uppercase;font-weight:700}
#spotify .m{font-size:18px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
#spotify .a{font-size:14px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#spotify .bar{height:4px;background:rgba(255,255,255,.2);border-radius:4px;margin-top:7px;overflow:hidden}
#spotify .bar div{height:100%;width:0;background:var(--spot);transition:width 1s linear}
#spotify.compact img,#spotify.compact .bar{display:none}
#spotify.compact{height:auto}

.counts{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px;flex:none}
.cnt{text-align:center;border-top:2px solid var(--line);padding-top:6px}
.cnt b{display:block;font-size:40px;font-weight:300;line-height:1.05}
.cnt small{font-size:12.5px;color:var(--sub);text-transform:uppercase;letter-spacing:.08em}

/* ================= Modos (controle remoto) ================= */
body.cinema #yt,body.frame #foto{position:absolute;inset:0;margin:0;border-radius:0;z-index:5;aspect-ratio:auto}
body.cinema .hide,body.frame .hide{opacity:0}
#mini{position:absolute;right:40px;bottom:30px;font-size:56px;font-weight:200;z-index:6;opacity:0;transition:opacity .8s;
  text-shadow:0 2px 12px rgba(0,0,0,.6);font-variant-numeric:tabular-nums}
body.frame #mini{opacity:1}
#toast{position:absolute;left:50%;bottom:90px;transform:translate(-50%,20px);background:rgba(0,0,0,.8);border:1px solid var(--line);
  border-radius:14px;padding:12px 22px;font-size:20px;opacity:0;transition:all .35s;z-index:10;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast kbd{font-family:inherit;background:rgba(255,255,255,.16);border-radius:6px;padding:1px 8px;margin:0 3px}
#night{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity 3s;z-index:20}
</style>
</head>
<body>
<div id="stage">
<div id="ui">

  <!-- ===== A ===== -->
  <div class="col hide">
    <div class="head">
      <div class="clock" id="clock">--:--</div>
      <div class="date" id="date">—<small id="greet"></small></div>
      <div class="wifi" id="wifi" style="display:none">
        <div class="t">Wi-Fi<small id="wifiNome"></small></div><canvas id="qr"></canvas>
      </div>
    </div>
    <div class="week" id="week"></div>
  </div>

  <!-- ===== B ===== -->
  <div class="col hide">
    <div class="days" id="days"></div>
    <div class="tick" id="tick"></div>
    <div class="news"><span class="src" id="newsSrc">NOTÍCIAS</span><span class="item" id="newsItem">Carregando…</span></div>
    <div class="lists">
      <div class="list" id="tarefas"><div class="lbl">☑ Tarefas</div><div id="tarefasBody" class="empty">Carregando…</div></div>
      <div class="list" id="email"><div class="lbl">✉ Gmail<span class="badge" id="mailN">–</span></div><div id="mailBody" class="empty">Carregando…</div></div>
    </div>
  </div>

  <!-- ===== C ===== -->
  <div class="col">
    <div class="wx hide">
      <div class="ico" id="wIco"></div><div class="temp" id="wTemp">--°</div>
      <div class="d"><b id="wCity"></b><span id="wDesc">Carregando…</span></div>
      <div class="fc" id="fc"></div>
    </div>
    <div class="media" id="yt"><div class="tag"><b>▶</b> <span id="ytSom">sem som</span></div><div id="ytFrame"></div></div>
    <div class="media" id="foto"><div class="ph fallback on" id="phA"></div><div class="ph" id="phB"></div></div>
    <div id="spotify" class="hide">
      <img id="spCapa" alt="">
      <div class="info"><div class="l" id="spL">Spotify</div><div class="m" id="spM">—</div><div class="a" id="spA"></div><div class="bar"><div id="spBar"></div></div></div>
    </div>
    <div class="counts hide" id="counts"></div>
  </div>

</div>
<div id="mini"></div>
<div id="toast"></div>
<div id="night"></div>
</div>

<script>
/* =========================================================
   CONFIG — mexa aqui
   ========================================================= */
const CONFIG = {
  nome: "Raphael",
  cidade: "São Bernardo do Campo",
  lat: -23.694, lon: -46.565,

  tema: "preto",             // "preto" | "laranja" | "roxo" | "azul" | "verde" | "escuro"

  // Grade da semana
  horaInicio: 7,             // primeira hora mostrada
  horaFim: 23,               // última hora mostrada

  // YouTube: { tipo:"aleatorio", ids:[...] } | { tipo:"playlist", id:"PL..." } (toca embaralhada) | { tipo:"video", id:"..." } | null
  // "aleatorio": sorteia um vídeo da lista; quando acaba (ou se estiver bloqueado), sorteia outro.
  // Para adicionar: copie o código depois de "v=" no link do YouTube e cole entre aspas na lista.
   youtube: { tipo: "playlist", id: "PLV7v7mwM6zaK0ztr7xOjYeDVhn8BM9b_m" },
  
  // Contagens regressivas (dias)
  contagens: [
    { nome: "Natal", data: "2026-12-25" },
    { nome: "Ano novo", data: "2027-01-01" }
  ],

  fotos: [],                 // fotos locais (se não usar a pasta do Drive)
  trocarFotoACada: 20,       // segundos

  cotacoes: ["USD-BRL", "EUR-BRL", "BTC-BRL", "ETH-BRL"],

  googleACada: 5,            // minutos
  spotifyACada: 10,          // segundos
  noturno: { inicio: "23:30", fim: "06:30", escurecer: 0.92 }
};
/* ========================================================= */

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pad = n => String(n).padStart(2, "0");
const H = new URLSearchParams(location.hash.slice(1));
const API = H.get("api") || "", TOKEN = H.get("token") || "";
document.body.classList.add("tema-" + CONFIG.tema);
$("#wCity").textContent = CONFIG.cidade.length > 16 ? CONFIG.cidade.replace(/^São /, "S. ") : CONFIG.cidade;

/* Sempre 16:9, escalado para qualquer tela (gira se a tela estiver em pé) */
function encaixar(){
  const emPe = innerHeight > innerWidth, W = emPe ? innerHeight : innerWidth, h = emPe ? innerWidth : innerHeight;
  $("#stage").style.transform = `translate(-50%,-50%)${emPe ? " rotate(90deg)" : ""} scale(${Math.min(W/1920, h/1080)})`;
}
addEventListener("resize", encaixar); encaixar();

async function api(acao, extra = ""){
  if (!API) throw new Error("sem api");
  const d = await (await fetch(`${API}?acao=${acao}&token=${encodeURIComponent(TOKEN)}${extra}`)).json();
  if (d.erro) throw new Error(d.erro);
  return d;
}
let toastT;
function toast(html, ms = 2200){
  const t = $("#toast"); t.innerHTML = html; t.classList.add("show");
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), ms);
}

/* ---------- Relógio ---------- */
let ultimoDia = new Date().getDate();
function tick(){
  const n = new Date(), h = n.getHours();
  $("#clock").innerHTML = `${pad(h)}:${pad(n.getMinutes())}<sup>${pad(n.getSeconds())}</sup>`;
  $("#mini").textContent = `${pad(h)}:${pad(n.getMinutes())}`;
  const dt = n.toLocaleDateString("pt-BR", {weekday:"long", day:"numeric", month:"long"});
  $("#date").firstChild.textContent = dt.charAt(0).toUpperCase() + dt.slice(1);
  $("#greet").textContent = `${h < 12 ? "Bom dia" : h < 18 ? "Boa tarde" : "Boa noite"}, ${CONFIG.nome}`;
  const toMin = t => { const [a, b] = t.split(":").map(Number); return a*60 + b; };
  const c = h*60 + n.getMinutes(), i = toMin(CONFIG.noturno.inicio), f = toMin(CONFIG.noturno.fim);
  $("#night").style.opacity = (i > f ? (c >= i || c < f) : (c >= i && c < f)) ? CONFIG.noturno.escurecer : 0;
  if (n.getSeconds() === 0){ renderAgenda(); contagens(); }
  if (n.getDate() !== ultimoDia){ ultimoDia = n.getDate(); google(); }
}
setInterval(tick, 1000);
setInterval(() => { $("#ui").style.transform = `translate(${Math.round(Math.random()*8-4)}px,${Math.round(Math.random()*8-4)}px)`; }, 5*60*1000);

/* ---------- Agenda: grade da semana + 3 dias ---------- */
let eventos = [];
const DIA = 864e5;
function hoje0(){ const d = new Date(); d.setHours(0,0,0,0); return d; }
function parseEv(e){
  const ini = e.diaInteiro ? new Date(e.inicio + "T00:00") : new Date(e.inicio);
  const fim = e.diaInteiro ? new Date(e.fim + "T00:00") : new Date(e.fim);
  return Object.assign({}, e, {ini, fimD: fim});
}
function corTexto(hex){
  const m = /^#?([0-9a-f]{6})$/i.exec(hex || ""); if (!m) return "#fff";
  const n = parseInt(m[1], 16), r = n>>16, g = (n>>8)&255, b = n&255;
  return (0.299*r + 0.587*g + 0.114*b) > 150 ? "#1a1030" : "#fff";
}
const hm = d => `${pad(d.getHours())}:${pad(d.getMinutes())}`;

function renderSemana(){
  const H0 = CONFIG.horaInicio, H1 = CONFIG.horaFim, span = (H1 - H0) * 60;
  const t0 = hoje0(), agora = new Date();
  const evs = eventos.map(parseEv);
  let html = `<div></div>`;
  for (let i = 0; i < 7; i++){
    const d = new Date(t0.getTime() + i*DIA);
    const wd = d.toLocaleDateString("pt-BR", {weekday:"short"}).replace(".", "");
    html += `<div class="wk-dh${i === 0 ? " today" : ""}">${wd}<b>${d.getDate()}</b></div>`;
  }
  // linha de "dia todo"
  html += `<div></div><div class="wk-ad">`;
  for (let i = 0; i < 7; i++){
    const a = new Date(t0.getTime() + i*DIA), b = new Date(a.getTime() + DIA);
    const ad = evs.filter(e => e.diaInteiro && e.ini < b && e.fimD > a);
    html += `<div class="cell">` + ad.slice(0, 2).map(e =>
      `<div class="pill" style="background:${esc(e.cor)};color:${corTexto(e.cor)}">${esc(e.titulo)}</div>`).join("") +
      (ad.length > 2 ? `<div class="more">+${ad.length - 2}</div>` : "") + `</div>`;
  }
  html += `</div>`;
  // horas
  html += `<div class="wk-hours">`;
  for (let h = H0 + 1; h < H1; h++) html += `<div style="top:${(h - H0) * 60 / span * 100}%">${pad(h)}h</div>`;
  html += `</div><div class="wk-body">`;
  for (let h = H0 + 1; h < H1; h++) html += `<div class="gl" style="top:${(h - H0) * 60 / span * 100}%"></div>`;
  for (let i = 0; i < 7; i++){
    const a = new Date(t0.getTime() + i*DIA);
    const lo = new Date(a.getTime() + H0*3600e3), hi = new Date(a.getTime() + H1*3600e3);
    // eventos com horário deste dia, recortados na janela visível
    const ds = evs.filter(e => !e.diaInteiro && e.ini < hi && e.fimD > lo)
      .map(e => ({e, s: Math.max(e.ini, lo), f: Math.min(e.fimD, hi)}))
      .sort((x, y) => x.s - y.s || y.f - x.f);
    // distribui eventos sobrepostos lado a lado
    let grupo = [], fimGrupo = 0; const grupos = [];
    ds.forEach(x => { if (grupo.length && x.s >= fimGrupo){ grupos.push(grupo); grupo = []; } grupo.push(x); fimGrupo = Math.max(fimGrupo, x.f); });
    if (grupo.length) grupos.push(grupo);
    let evHtml = "";
    grupos.forEach(g => {
      const faixas = [];
      g.forEach(x => { let k = faixas.findIndex(fim => fim <= x.s); if (k < 0){ k = faixas.length; faixas.push(0); } faixas[k] = x.f; x.k = k; });
      g.forEach(x => {
        const top = (x.s - lo) / 60000 / span * 100, alt = Math.max((x.f - x.s) / 60000 / span * 100, 2.2);
        const w = 100 / faixas.length;
        const passado = x.e.fimD < agora ? " past" : "";
        const altPx = alt / 100 * 800;
        evHtml += `<div class="ev${passado}" style="top:${top}%;height:${alt}%;left:calc(${x.k*w}% + 2px);width:calc(${w}% - 4px);background:${esc(x.e.cor)};color:${corTexto(x.e.cor)}">` +
          `<b>${esc(x.e.titulo)}</b>${altPx > 34 ? `<span>${hm(x.e.ini)}–${hm(x.e.fimD)}</span>` : ""}</div>`;
      });
    });
    if (i === 0 && agora > lo && agora < hi){
      const top = (agora - lo) / 60000 / span * 100;
      evHtml += `<div class="nowline" style="top:${top}%"></div>`;
    }
    html += `<div class="wk-day${i === 0 ? " today" : ""}">${evHtml}</div>`;
  }
  html += `</div>`;
  $("#week").innerHTML = html;
  // etiqueta da hora atual na coluna de horas
  if (agora.getHours() >= H0 && agora.getHours() < H1){
    const top = ((agora.getHours() - H0) * 60 + agora.getMinutes()) / span * 100;
    $(".wk-hours").insertAdjacentHTML("beforeend", `<span class="nowtag" style="left:4px;top:${top}%">${hm(agora)}</span>`);
  }
}

function renderDias(){
  const t0 = hoje0(), agora = new Date(), evs = eventos.map(parseEv);
  const nomes = ["Hoje", "Amanhã"];
  let html = "";
  for (let i = 0; i < 3; i++){
    const a = new Date(t0.getTime() + i*DIA), b = new Date(a.getTime() + DIA);
    const rot = nomes[i] || a.toLocaleDateString("pt-BR", {weekday:"long"}).replace("-feira", "");
    const lista = evs.filter(e => e.ini < b && e.fimD > a).sort((x, y) => (y.diaInteiro - x.diaInteiro) || (x.ini - y.ini));
    let itens = lista.slice(0, 7).map(e => {
      const passado = !e.diaInteiro && e.fimD < agora, now = !e.diaInteiro && e.ini <= agora && e.fimD > agora;
      const quando = e.diaInteiro ? "Dia todo" : now ? `Agora · até ${hm(e.fimD)}` : `${hm(e.ini)} – ${hm(e.fimD)}`;
      return `<div class="it${passado ? " past" : ""}${now ? " now" : ""}" style="border-color:${esc(e.cor)}"><time>${quando}</time><b>${esc(e.titulo)}</b></div>`;
    }).join("");
    if (lista.length > 7) itens += `<div class="more">+ ${lista.length - 7} evento(s)</div>`;
    if (!lista.length) itens = `<div class="empty">${API ? "Livre 🎉" : "Conecte o Apps Script"}</div>`;
    html += `<div class="day"><h2>${pad(a.getDate())}<small>${esc(rot)}</small></h2>${itens}</div>`;
  }
  $("#days").innerHTML = html;
}
function renderAgenda(){ renderSemana(); renderDias(); }

/* ---------- Tarefas, Gmail, notícias, Wi-Fi ---------- */
function renderTarefas(listas){
  if (!listas || !listas.length){ $("#tarefasBody").className = "empty"; $("#tarefasBody").textContent = API ? "Nenhuma lista no Google Tasks" : "Conecte o Apps Script"; return; }
  $("#tarefasBody").className = "";
  $("#tarefasBody").innerHTML = listas.map((l, i) =>
    (listas.length > 1 ? `<div class="sub-h"${i === 0 ? ' style="margin-top:0"' : ""}>${esc(l.nome)}</div>` : "") +
    (l.itens.length ? l.itens.slice(0, listas.length > 1 ? 4 : 8).map(t => {
      const p = t.prazo ? new Date(t.prazo).toLocaleDateString("pt-BR", {day:"2-digit", month:"2-digit", timeZone:"UTC"}) : "";
      return `<div class="task"><span>${esc(t.titulo)}</span>${p ? `<small>${p}</small>` : ""}</div>`;
    }).join("") : `<div class="empty">Tudo feito ✓</div>`)
  ).join("");
}
function renderEmail(m){
  $("#mailN").textContent = m.naoLidos > 99 ? "99+" : m.naoLidos;
  if (!m.itens.length){ $("#mailBody").className = "empty"; $("#mailBody").textContent = m.naoLidos ? `${m.naoLidos} não lido(s)` : "Caixa em dia ✓"; return; }
  $("#mailBody").className = "";
  $("#mailBody").innerHTML = m.itens.slice(0, 4).map(i => `<div class="mail"><b>${esc(i.de)}</b><span>${esc(i.assunto)}</span></div>`).join("");
}
function renderWifi(w){
  if (!w || typeof qrcode === "undefined"){ $("#wifi").style.display = "none"; return; }
  const q = qrcode(0, "M"); q.addData(w.qr); q.make();
  const n = q.getModuleCount(), c = $("#qr"); c.width = c.height = n;
  const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, n, n); g.fillStyle = "#000";
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) if (q.isDark(y, x)) g.fillRect(x, y, 1, 1);
  $("#wifiNome").textContent = w.rede; $("#wifi").style.display = "";
}
let noticias = [], nIdx = 0;
function girarNoticia(){
  if (!noticias.length) return;
  const n = noticias[nIdx++ % noticias.length], el = $("#newsItem");
  el.style.opacity = 0;
  setTimeout(() => { el.textContent = n.titulo; $("#newsSrc").textContent = /g1/i.test(n.fonte) ? "G1" : "NOTÍCIAS"; el.style.opacity = 1; }, 600);
}
setInterval(girarNoticia, 12000);

async function google(){
  if (!API){ renderAgenda(); renderTarefas(null); $("#mailBody").textContent = "Conecte o Apps Script"; $("#newsItem").textContent = "Conecte o Apps Script para ver as notícias."; return; }
  try{
    const d = await api("google");
    eventos = d.agenda || []; renderAgenda();
    renderTarefas(d.tarefas); renderEmail(d.email); renderWifi(d.wifi);
    const primeira = !noticias.length;
    if (d.noticias && d.noticias.length) noticias = d.noticias;
    if (primeira) girarNoticia();
  }catch(e){}
}

/* ---------- Clima ---------- */
const WMO = {0:["☀️","Céu limpo"],1:["🌤️","Poucas nuvens"],2:["⛅","Parc. nublado"],3:["☁️","Nublado"],45:["🌫️","Neblina"],48:["🌫️","Neblina"],
  51:["🌦️","Garoa"],53:["🌦️","Garoa"],55:["🌧️","Garoa forte"],61:["🌧️","Chuva fraca"],63:["🌧️","Chuva"],65:["🌧️","Chuva forte"],
  80:["🌦️","Pancadas"],81:["🌧️","Pancadas"],82:["⛈️","Pancadas fortes"],95:["⛈️","Trovoadas"],96:["⛈️","Trovoadas"],99:["⛈️","Trovoadas"]};
const wmo = c => WMO[c] || ["🌡️","—"];
async function clima(){
  try{
    const d = await (await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${CONFIG.lat}&longitude=${CONFIG.lon}` +
      `&current=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=America%2FSao_Paulo&forecast_days=4`)).json();
    $("#wIco").textContent = wmo(d.current.weather_code)[0];
    $("#wTemp").textContent = Math.round(d.current.temperature_2m) + "°";
    $("#wDesc").textContent = `${wmo(d.current.weather_code)[1]} · ${Math.round(d.daily.temperature_2m_max[0])}° / ${Math.round(d.daily.temperature_2m_min[0])}°`;
    $("#fc").innerHTML = d.daily.time.slice(1, 4).map((t, i) => {
      const dia = new Date(t + "T12:00").toLocaleDateString("pt-BR", {weekday:"short"}).replace(".", "");
      return `<div>${dia}<b>${wmo(d.daily.weather_code[i+1])[0]}</b><span>${Math.round(d.daily.temperature_2m_max[i+1])}°</span> ${Math.round(d.daily.temperature_2m_min[i+1])}°</div>`;
    }).join("");
  }catch(e){ $("#wDesc").textContent = "Clima indisponível"; }
}

/* ---------- Cotações ---------- */
async function cotacoes(){
  try{
    const d = await (await fetch("https://economia.awesomeapi.com.br/json/last/" + CONFIG.cotacoes.join(","))).json();
    $("#tick").innerHTML = Object.values(d).map(c => {
      const v = Number(c.bid), p = Number(c.pctChange);
      const f = v > 1000 ? v.toLocaleString("pt-BR", {maximumFractionDigits:0}) : v.toLocaleString("pt-BR", {minimumFractionDigits:2, maximumFractionDigits:2});
      return `<div class="tk"><small>${esc(c.code)}</small><b>R$ ${f}</b><i class="${p >= 0 ? "up" : "down"}">${p >= 0 ? "▲" : "▼"} ${Math.abs(p).toFixed(2)}%</i></div>`;
    }).join("");
  }catch(e){}
}

/* ---------- Contagens ---------- */
function contagens(){
  const t0 = hoje0();
  $("#counts").innerHTML = CONFIG.contagens.slice(0, 2).map(c => {
    const n = Math.round((new Date(c.data + "T00:00") - t0) / DIA);
    return `<div class="cnt"><b>${n > 0 ? n : n === 0 ? "Hoje!" : "—"}</b><small>${n === 1 ? "dia" : "dias"} p/ ${esc(c.nome)}</small></div>`;
  }).join("");
}

/* ---------- Fotos ---------- */
let fotos = [], fIdx = -1, front = $("#phA"), back = $("#phB"), fotoTimer;
async function carregarFotos(){
  try{ const d = await api("fotos"); if (d.fotos.length){ fotos = d.fotos.map(id => ({drive:id})); return; } }catch(e){}
  fotos = CONFIG.fotos.map(src => ({src}));
}
async function urlFoto(f){
  if (f.src) return f.src;
  if (!f.url){ const d = await api("foto", "&id=" + encodeURIComponent(f.drive)); f.url = `data:${d.mime};base64,${d.b64}`; }
  return f.url;
}
async function mostrarFoto(delta = 1){
  if (!fotos.length) return;
  fIdx = (fIdx + delta + fotos.length) % fotos.length;
  try{
    const url = await urlFoto(fotos[fIdx]);
    back.classList.remove("fallback"); back.style.backgroundImage = `url("${url}")`;
    back.classList.add("on"); front.classList.remove("on"); [front, back] = [back, front];
    fotos.forEach((f, i) => { if (f.drive && f.url && Math.abs(i - fIdx) > 1) delete f.url; });
  }catch(e){}
  clearInterval(fotoTimer); fotoTimer = setInterval(() => mostrarFoto(1), CONFIG.trocarFotoACada*1000);
}

/* ---------- Spotify ---------- */
let sp = null, spAt = 0;
function renderSpotify(){
  const box = $("#spotify");
  if (!sp || sp.status === "desativado"){ box.style.display = API ? "none" : ""; if (!API){ box.classList.add("compact"); $("#spM").textContent = "Não conectado"; } return; }
  box.style.display = "";
  if (sp.status === "tocando" || sp.status === "pausado"){
    box.classList.remove("compact");
    if ($("#spCapa").dataset.src !== sp.capa){ $("#spCapa").src = sp.capa; $("#spCapa").dataset.src = sp.capa; }
    $("#spL").textContent = sp.status === "tocando" ? "♫ Tocando agora" : "❚❚ Pausado";
    $("#spM").textContent = sp.musica; $("#spA").textContent = sp.artista;
    const prog = sp.status === "tocando" ? Math.min(sp.duracao, sp.progresso + (Date.now() - spAt)) : sp.progresso;
    $("#spBar").style.width = (sp.duracao ? prog / sp.duracao * 100 : 0) + "%";
  } else {
    box.classList.add("compact"); $("#spL").textContent = "Spotify";
    $("#spM").textContent = sp.status === "desconectado" ? "Conta não conectada" : "Nada tocando"; $("#spA").textContent = "";
  }
}
async function spotify(){ try{ const d = await api("spotify"); sp = d.spotify; spAt = Date.now(); }catch(e){} renderSpotify(); }

/* ---------- YouTube ---------- */
let yt = null, ytFila = [], ytFalhas = 0;
function sortearVideo(){
  const ids = CONFIG.youtube.ids || [];
  if (!ytFila.length){
    ytFila = ids.slice().sort(() => Math.random() - .5);           // embaralha
    if (ytFila.length > 1 && yt && yt.getVideoData && ytFila[0] === yt.getVideoData().video_id) ytFila.push(ytFila.shift());
  }
  return ytFila.shift();
}
function proximoVideo(avisar){
  const c = CONFIG.youtube;
  if (!yt || !c) return;
  if (c.tipo === "aleatorio") yt.loadVideoById(sortearVideo());
  else if (c.tipo === "playlist") yt.nextVideo();
  if (avisar) toast("⏭ Próximo vídeo", 1200);
}
(function(){
  const c = CONFIG.youtube;
  if (!c || (c.tipo === "aleatorio" && !(c.ids || []).length)){ $("#yt").style.display = "none"; CONFIG.youtube = null; return; }
  const s = document.createElement("script"); s.src = "https://www.youtube.com/iframe_api"; document.head.appendChild(s);
})();
window.onYouTubeIframeAPIReady = () => {
  const c = CONFIG.youtube; if (!c) return;
  const vars = { autoplay: 1, mute: 1, controls: 0, rel: 0, playsinline: 1, iv_load_policy: 3, modestbranding: 1 };
  if (location.protocol.startsWith("http")) vars.origin = location.origin;
  const opt = { width: "100%", height: "100%", playerVars: vars, events: {
    onReady: e => {
      e.target.mute();
      if (c.tipo === "playlist"){ e.target.setShuffle(true); e.target.setLoop(true); e.target.playVideoAt(0); }
      e.target.playVideo();
    },
    onStateChange: e => {
      if (e.data === YT.PlayerState.PLAYING) ytFalhas = 0;
      if (e.data === YT.PlayerState.ENDED){ if (c.tipo === "video") e.target.playVideo(); else proximoVideo(); }
    },
    onError: () => {                                    // vídeo bloqueado/removido: pula para outro
      ytFalhas++;
      const limite = c.tipo === "aleatorio" ? (c.ids.length + 1) : 3;
      if (ytFalhas > limite || c.tipo === "video"){ $("#yt").style.display = "none"; return; }
      setTimeout(() => proximoVideo(), 1500);
    }
  }};
  if (c.tipo === "aleatorio") opt.videoId = sortearVideo();
  else if (c.tipo === "playlist"){ vars.listType = "playlist"; vars.list = c.id; }
  else if (c.tipo === "live"){ opt.videoId = "live_stream"; vars.channel = c.canal; }
  else opt.videoId = c.id;
  yt = new YT.Player("ytFrame", opt);
};
function somYouTube(){
  if (!yt || !yt.isMuted) return toast("YouTube ainda carregando…");
  if (yt.isMuted()){ yt.unMute(); yt.setVolume(70); $("#ytSom").textContent = "com som"; toast("🔊 Som ligado"); }
  else { yt.mute(); $("#ytSom").textContent = "sem som"; toast("🔇 Som desligado"); }
}

/* ---------- Controle remoto ---------- */
const AJUDA = `<kbd>OK</kbd> som · <kbd>↑</kbd> YouTube tela cheia · <kbd>↓</kbd> foto tela cheia · <kbd>←</kbd><kbd>→</kbd> fotos (na tela cheia do YouTube, <kbd>→</kbd> pula o vídeo)`;
document.addEventListener("keydown", e => {
  const k = e.key, kc = e.keyCode, b = document.body.classList;
  if (k === "Enter" || kc === 13 || kc === 23 || k === "MediaPlayPause" || kc === 179 || kc === 85) somYouTube();
  else if (k === "ArrowUp" || kc === 38 || kc === 19){ if (!CONFIG.youtube) return; b.remove("frame"); b.toggle("cinema"); toast(b.contains("cinema") ? "YouTube em tela cheia — <kbd>↑</kbd> volta" : "Painel"); }
  else if (k === "ArrowDown" || kc === 40 || kc === 20){ b.remove("cinema"); b.toggle("frame"); toast(b.contains("frame") ? "Foto em tela cheia — <kbd>↓</kbd> volta" : "Painel"); }
  else if ((k === "ArrowRight" || kc === 39 || kc === 22) && b.contains("cinema")) proximoVideo(true);
  else if (k === "ArrowRight" || kc === 39 || kc === 22){ mostrarFoto(1); toast("Próxima foto", 1000); }
  else if (k === "ArrowLeft" || kc === 37 || kc === 21){ mostrarFoto(-1); toast("Foto anterior", 1000); }
  else if (k === "ContextMenu" || kc === 82 || k === "?") toast(AJUDA, 5000);
  else return;
  e.preventDefault();
});

/* ---------- Início ---------- */
tick(); renderAgenda(); contagens(); clima(); cotacoes(); google(); spotify();
carregarFotos().then(() => mostrarFoto(1));
setInterval(clima, 20*60*1000);
setInterval(cotacoes, 10*60*1000);
setInterval(google, CONFIG.googleACada*60*1000);
setInterval(spotify, CONFIG.spotifyACada*1000); setInterval(renderSpotify, 1000);
setInterval(carregarFotos, 60*60*1000);
setTimeout(() => toast(AJUDA, 7000), 2500);
setTimeout(() => location.reload(), 24*60*60*1000);
</script>
